# orca.yaml — committed setup for Folio Orca workspaces.
#
# scripts.setup runs once when a new workspace/worktree is created (initial
# loading). defaultTabs open automatically when the workspace is activated, so a
# fresh checkout boots the full dev stack without manual steps. Mirrors the
# "Local Development" flow in README.md.

scripts:
  setup: |
    pnpm install
    [ -f .env ] || cp .env.example .env
    pnpm db:up

defaultTabs:
  - title: db
    color: "#a855f7"
    command: pnpm db:up && docker compose -f docker-compose.dev.yml logs -f
  - title: backend
    color: "#22c55e"
    command: pnpm dev:backend
  - title: web
    color: "#3b82f6"
    command: pnpm dev:web
  - title: shell
    color: "#6b7280"
