services:
  backend:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:backend-${IMAGE_TAG}
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
      PORT: 8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:worker-${IMAGE_TAG}
    command: ["pnpm", "--filter", "@folio/backend", "exec", "tsx", "src/worker.ts"]
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
    restart: unless-stopped

  web:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:web-${IMAGE_TAG}
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
