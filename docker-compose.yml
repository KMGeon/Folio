services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
      PORT: 8080
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["pnpm", "--filter", "@folio/backend", "exec", "tsx", "src/worker.ts"]
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file:
      - .env
    environment:
      APP_PROFILE: prd
      NODE_ENV: production
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
