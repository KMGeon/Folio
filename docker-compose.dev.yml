services:
  postgres:
    image: postgres:16-alpine
    container_name: folio-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports:
      - "5433:5432"
    volumes:
      - folio-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  folio-pg-data:
