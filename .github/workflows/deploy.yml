name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s\n" "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host folio-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking yes
          EOF

      - name: Sync release files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'dist/' \
            ./ "folio-ec2:$DEPLOY_PATH/"

      - name: Rebuild and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "cd '$DEPLOY_PATH' && test -f .env && docker compose up -d --build --remove-orphans && if sudo test -f /etc/letsencrypt/live/folio.ai.kr/fullchain.pem; then sudo cp nginx/folio.conf /etc/nginx/sites-available/folio; else sudo cp nginx/folio-http.conf /etc/nginx/sites-available/folio; fi && sudo ln -sf /etc/nginx/sites-available/folio /etc/nginx/sites-enabled/folio && sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx && docker image prune -f && docker compose ps"

      - name: Smoke test deployment
        run: |
          set -euo pipefail
          ssh folio-ec2 "sudo ss -ltn | grep -q ':80 ' && sudo ss -ltn | grep -q ':443 ' && curl -fsS http://127.0.0.1:8080/health >/dev/null && curl -fsS https://folio.ai.kr/health >/dev/null"
