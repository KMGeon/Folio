name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 531546477262.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: folio
  IMAGE_TAG: ${{ github.sha }}
  NEXT_PUBLIC_API_BASE_URL: https://folio.ai.kr

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend images
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file apps/backend/Dockerfile \
            --cache-from type=gha,scope=folio-backend \
            --cache-to type=gha,scope=folio-backend,mode=max \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:worker-$IMAGE_TAG" \
            --push \
            .

      - name: Build and push web image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --cache-from type=gha,scope=folio-web \
            --cache-to type=gha,scope=folio-web,mode=max \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:web-$IMAGE_TAG" \
            --push \
            .

      - name: Allow runner SSH to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          runner_ip="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          security_groups="$(
            aws ec2 describe-instances \
              --filters "Name=ip-address,Values=$EC2_HOST" "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].SecurityGroups[].GroupId' \
              --output text
          )"
          test -n "$security_groups"
          {
            echo "RUNNER_SSH_CIDR=$runner_ip/32"
            echo "RUNNER_SSH_SECURITY_GROUPS=$security_groups"
          } >> "$GITHUB_ENV"
          for security_group in $security_groups; do
            aws ec2 authorize-security-group-ingress \
              --group-id "$security_group" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$runner_ip/32,Description=GitHub Actions deploy run $GITHUB_RUN_ID}]" \
              || true
          done

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s\n" "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host folio-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking yes
          EOF

      - name: Sync release files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'dist/' \
            ./ "folio-ec2:$DEPLOY_PATH/"

      - name: Rebuild and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            ssh folio-ec2 "docker login --username AWS --password-stdin '$ECR_REGISTRY'"
          ssh folio-ec2 "DEPLOY_PATH='$DEPLOY_PATH' ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env
          docker container prune -f || true
          docker image prune -af || true
          docker builder prune -af || true
          docker system prune -f || true
          docker compose pull
          # The SSH heredoc provides stdin; keep compose-run from consuming the
          # remaining deployment commands after migrations finish.
          docker compose run -T --rm --no-deps backend pnpm --filter @folio/db db:migrate < /dev/null
          docker compose up -d --remove-orphans
          if sudo test -f /etc/letsencrypt/live/folio.ai.kr/fullchain.pem; then
            sudo cp nginx/folio.conf /etc/nginx/sites-available/folio
          else
            sudo cp nginx/folio-http.conf /etc/nginx/sites-available/folio
          fi
          sudo ln -sf /etc/nginx/sites-available/folio /etc/nginx/sites-enabled/folio
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Smoke test deployment
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "DEPLOY_PATH='$DEPLOY_PATH' ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 30); do
            dashboard_status=$(curl -ksS -o /dev/null -w '%{http_code}' https://folio.ai.kr/api/v1/dashboard || true)
            if sudo ss -ltn | grep -q ':80 ' &&
              sudo ss -ltn | grep -q ':443 ' &&
              curl -fsS http://127.0.0.1:8080/health >/dev/null &&
              curl -fsS https://folio.ai.kr/health >/dev/null &&
              { test "$dashboard_status" = 200 || test "$dashboard_status" = 401; }; then
              exit 0
            fi
            sleep 2
          done
          sudo ss -ltnp
          docker compose -f "$DEPLOY_PATH/docker-compose.yml" --project-directory "$DEPLOY_PATH" ps
          curl -ksS -D - https://folio.ai.kr/api/v1/dashboard || true
          exit 1
          REMOTE

      - name: Revoke runner SSH from EC2
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_SSH_CIDR:-}" ] || [ -z "${RUNNER_SSH_SECURITY_GROUPS:-}" ]; then
            exit 0
          fi
          for security_group in $RUNNER_SSH_SECURITY_GROUPS; do
            aws ec2 revoke-security-group-ingress \
              --group-id "$security_group" \
              --protocol tcp \
              --port 22 \
              --cidr "$RUNNER_SSH_CIDR" \
              || true
          done
