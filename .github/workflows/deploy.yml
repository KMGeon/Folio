name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 531546477262.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: folio
  IMAGE_TAG: ${{ github.sha }}
  NEXT_PUBLIC_API_BASE_URL: https://folio.ai.kr

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend images
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file apps/backend/Dockerfile \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:backend-$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:worker-$IMAGE_TAG" \
            --push \
            .

      - name: Build and push web image
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:web-$IMAGE_TAG" \
            --push \
            .

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf "%s\n" "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host folio-ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_key
            StrictHostKeyChecking yes
          EOF

      - name: Sync release files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'dist/' \
            ./ "folio-ec2:$DEPLOY_PATH/"

      - name: Rebuild and restart
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            ssh folio-ec2 "docker login --username AWS --password-stdin '$ECR_REGISTRY'"
          ssh folio-ec2 "DEPLOY_PATH='$DEPLOY_PATH' ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env
          docker compose pull
          docker compose run --rm --no-deps backend pnpm --filter @folio/db db:migrate
          docker compose up -d --remove-orphans
          if sudo test -f /etc/letsencrypt/live/folio.ai.kr/fullchain.pem; then
            sudo cp nginx/folio.conf /etc/nginx/sites-available/folio
          else
            sudo cp nginx/folio-http.conf /etc/nginx/sites-available/folio
          fi
          sudo ln -sf /etc/nginx/sites-available/folio /etc/nginx/sites-enabled/folio
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx
          docker image prune -f
          docker compose ps
          REMOTE

      - name: Smoke test deployment
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh folio-ec2 "DEPLOY_PATH='$DEPLOY_PATH' ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          for i in $(seq 1 30); do
            dashboard_status=$(curl -ksS -o /dev/null -w '%{http_code}' https://folio.ai.kr/api/v1/dashboard || true)
            if sudo ss -ltn | grep -q ':80 ' &&
              sudo ss -ltn | grep -q ':443 ' &&
              curl -fsS http://127.0.0.1:8080/health >/dev/null &&
              curl -fsS https://folio.ai.kr/health >/dev/null &&
              { test "$dashboard_status" = 200 || test "$dashboard_status" = 401; }; then
              exit 0
            fi
            sleep 2
          done
          sudo ss -ltnp
          docker compose -f "$DEPLOY_PATH/docker-compose.yml" --project-directory "$DEPLOY_PATH" ps
          curl -ksS -D - https://folio.ai.kr/api/v1/dashboard || true
          exit 1
          REMOTE
