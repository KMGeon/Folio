name: Release

on:
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Create deployment release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Create deployment release
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags --prune

          previous_tag=""
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              previous_tag="$tag"
              break
            fi
          done < <(git tag --list --sort=-version:refname)
          if [ -z "$previous_tag" ]; then
            release_tag="v0.0.1"
          else
            version="${previous_tag#v}"
            IFS=. read -r major minor patch <<< "$version"
            release_tag="v${major}.${minor}.$((patch + 1))"
          fi
          release_title="$release_tag"

          {
            echo "## Production deploy"
            echo
            echo "Folio was deployed to production from \`${DEPLOY_SHA}\` after the deployment smoke test passed."
            echo
            echo "## Included commits"
            echo
            if [ -n "$previous_tag" ] && git rev-parse --verify --quiet "$previous_tag^{commit}" >/dev/null; then
              git log --pretty=format:'- `%h` %s' "${previous_tag}..${DEPLOY_SHA}"
            else
              git log -1 --pretty=format:'- `%h` %s' "$DEPLOY_SHA"
            fi
          } > release-notes.md

          gh release create "$release_tag" \
            --target "$DEPLOY_SHA" \
            --title "$release_title" \
            --notes-file release-notes.md \
            --latest
